<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2147"/>
      <stop offset="100%" stop-color="#102f65"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#40F39A"/>
      <stop offset="100%" stop-color="#2bd683"/>
    </linearGradient>
    <clipPath id="circle2">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg2)"/>

  <!-- Subtle dot pattern -->
  <g opacity="0.06">
    <circle cx="50" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="100" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="150" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="200" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="250" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="300" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="350" cy="50" r="2" fill="#9cb5f4"/>
    <circle cx="50" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="100" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="150" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="200" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="250" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="300" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="350" cy="100" r="2" fill="#9cb5f4"/>
    <circle cx="50" cy="150" r="2" fill="#9cb5f4"/>
    <circle cx="100" cy="150" r="2" fill="#9cb5f4"/>
    <circle cx="350" cy="150" r="2" fill="#9cb5f4"/>
    <circle cx="50" cy="200" r="2" fill="#9cb5f4"/>
    <circle cx="350" cy="200" r="2" fill="#9cb5f4"/>
  </g>

  <!-- Person silhouette -->
  <circle cx="200" cy="148" r="52" fill="#2b467d"/>
  <ellipse cx="200" cy="310" rx="90" ry="70" fill="#2b467d"/>
  <ellipse cx="200" cy="280" rx="60" ry="40" fill="#2b467d"/>

  <!-- Accent ring -->
  <circle cx="200" cy="148" r="56" fill="none" stroke="url(#accent2)" stroke-width="2.5" opacity="0.6"/>

  <!-- Initials -->
  <text x="200" y="160" font-family="'Manrope', 'Arial', sans-serif" font-size="44" font-weight="800" fill="#40F39A" text-anchor="middle" dominant-baseline="middle" opacity="0.9">HS</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="370" width="400" height="30" fill="url(#accent2)" opacity="0.15" clip-path="url(#circle2)"/>
  <rect x="70" y="374" width="260" height="3" rx="2" fill="url(#accent2)" opacity="0.7" clip-path="url(#circle2)"/>
</svg>
